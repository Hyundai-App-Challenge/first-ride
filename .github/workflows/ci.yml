name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # :engine은 순수 Kotlin이라 에뮬레이터 없이 돈다(기술 설계 9-4절). :platform, :app은 단위 테스트와 debug 빌드까지 본다.
      # release 빌드는 서명 키가 저장소 밖에 있어 여기서 하지 않는다.
      - run: ./gradlew :engine:test :platform:testDebugUnitTest :app:testDebugUnitTest assembleDebug --stacktrace
